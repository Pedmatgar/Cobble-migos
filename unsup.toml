[flavor_groups.rendimiento]
name = "Perfil de Rendimiento y Gráficos"
description = "Elige la versión del modpack que mejor se adapte a tu ordenador.\n<i>Afecta la cantidad de mods visuales, físicas y de ambiente instalados.</i>"
side = "client"

# --- OPCIÓN LOW END ---
[[flavor_groups.rendimiento.choices]]
id = "low_end"
name = "Low End"
description = "<b>Rendimiento Máximo</b>\nLa versión base del modpack. Recomendado para PCs de bajos recursos.\nNo incluye shaders, físicas avanzadas ni efectos visuales pesados para garantizar los mejores FPS."

# --- OPCIÓN HIGH END ---
[[flavor_groups.rendimiento.choices]]
id = "high_end"
name = "High End"
description = "<b>Experiencia Completa</b>\nPara PCs potentes. Incluye todas las mejoras visuales y de inmersión:<ul><li>Distant Horizons e Iris (Shaders)</li><li>Físicas de sonido y físicas de objetos</li><li>Efectos de lluvia, charcos y nubes realistas</li><li>Luces dinámicas y otros efectos inmersivos</li></ul>"


