name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Verifica si v5 está disponible o usa v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/packwiz" --help >/dev/null

      - name: Expose Modrinth and CurseForge tokens for packwiz
        # Pasa los secretos a través de 'env' por seguridad
        env:
          MODRINTH_SECRET: ${{ secrets.MODRINTH_API_TOKEN }}
          CURSEFORGE_SECRET: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          # Lee las variables de entorno nativas en lugar de interpolar
          if [ -n "$MODRINTH_SECRET" ]; then
            echo "PACKWIZ_MODRINTH_TOKEN=$MODRINTH_SECRET" >> "$GITHUB_ENV"
            echo "MODRINTH_API_TOKEN=$MODRINTH_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -n "$CURSEFORGE_SECRET" ]; then
            echo "PACKWIZ_CURSEFORGE_API_TOKEN=$CURSEFORGE_SECRET" >> "$GITHUB_ENV"
            echo "CURSEFORGE_API_TOKEN=$CURSEFORGE_SECRET" >> "$GITHUB_ENV"
          fi