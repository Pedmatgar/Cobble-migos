name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/packwiz" --help >/dev/null

      - name: Expose Modrinth and CurseForge tokens for packwiz
        run: |
          if [ -n "${{ secrets.MODRINTH_API_TOKEN }}" ]; then
            echo "PACKWIZ_MODRINTH_TOKEN=${{ secrets.MODRINTH_API_TOKEN }}" >> "$GITHUB_ENV"
            echo "MODRINTH_API_TOKEN=${{ secrets.MODRINTH_API_TOKEN }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.CURSEFORGE_API_TOKEN }}" ]; then
            echo "PACKWIZ_CURSEFORGE_API_TOKEN=${{ secrets.CURSEFORGE_API_TOKEN }}" >> "$GITHUB_ENV"
            echo "CURSEFORGE_API_TOKEN=${{ secrets.CURSEFORGE_API_TOKEN }}" >> "$GITHUB_ENV"
          fi