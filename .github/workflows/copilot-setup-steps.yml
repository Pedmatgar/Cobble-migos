name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Configure packwiz API credentials
        run: |
          if [ -n "${{ secrets.CURSEFORGE_API_KEY }}" ]; then
            echo "PACKWIZ_CURSEFORGE_API_KEY=${{ secrets.CURSEFORGE_API_KEY }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.MODRINTH_TOKEN }}" ]; then
            echo "PACKWIZ_MODRINTH_API_TOKEN=${{ secrets.MODRINTH_TOKEN }}" >> "$GITHUB_ENV"
          fi

      - name: Validate packwiz install and API connectivity
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          packwiz --version
          curl -fsSL https://api.modrinth.com/v2/tag/loader > /dev/null
          if [ -n "$CURSEFORGE_API_KEY" ]; then
            curl -fsSL \
              -H "x-api-key: $CURSEFORGE_API_KEY" \
              "https://api.curseforge.com/v1/categories?gameId=432" > /dev/null
          else
            echo "CURSEFORGE_API_KEY is not set; skipping authenticated CurseForge call."
          fi
