name: Modpack CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  modpack-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKWIZ_MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
      MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
      PACKWIZ_CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Export Modrinth pack
        run: |
          # Solo exportamos si tenemos el token de CurseForge o si no hay mods de CF
          packwiz mr export -o "$RUNNER_TEMP/modpack.mrpack"

      - name: Unpack and Collect Jars
        run: |
          python - <<'PY'
          import zipfile
          import json
          import shutil
          import urllib.request
          from pathlib import Path

          temp = Path("${{ runner.temp }}")
          mrpack = temp / "modpack.mrpack"
          unpacked = temp / "modpack-unpacked"
          collected = temp / "collected-mods"
          collected.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(mrpack) as zf:
              zf.extractall(unpacked)

          for folder in ("overrides", "client-overrides", "server-overrides"):
              mods_dir = unpacked / folder / "mods"
              if mods_dir.exists():
                  for jar in mods_dir.glob("*.jar"):
                      shutil.copy2(jar, collected / jar.name)

          index_path = unpacked / "modrinth.index.json"
          data = json.loads(index_path.read_text(encoding="utf-8"))
          for file_entry in data.get("files", []):
              path = file_entry.get("path", "")
              if path.startswith("mods/"):
                  destination = collected / Path(path).name
                  if not destination.exists():
                      print(f"Downloading {path}...")
                      urllib.request.urlretrieve(file_entry["downloads"][0], destination)
          PY
      - name: Dependency Check (Ultra-Detailed Version)
        run: |
          pip install tomli
          python - <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          jars_dir = Path("${{ runner.temp }}") / "collected-mods"
          
          # Cosas que ignoramos porque son del sistema o de Fabric API
          ignore_list = {"minecraft", "java", "fabricloader", "fabric", "forge", "neoforge", "quilt_loader", "mixinextras"}
          ignore_prefixes = ["fabric-", "quilt-", "canvas-"]
          
          provided = set()
          required = {}

          print("🔍 STAGE 1: Scanning all installed mods...")
          for jar in jars_dir.glob("*.jar"):
              try:
                  with zipfile.ZipFile(jar) as zf:
                      if "fabric.mod.json" in zf.namelist():
                          data = json.loads(zf.read("fabric.mod.json").decode("utf-8", errors="ignore"), strict=False)
                          mod_id = data.get("id", "").lower()
                          if mod_id:
                              provided.add(mod_id)
                              print(f"  [FOUND] mod_id: '{mod_id}' (from {jar.name})")
                              
                              # Añadimos lo que el mod 'provee' (sub-librerías internas)
                              for p in data.get("provides", []):
                                  provided.add(p.lower())
                              
                              # RECOLECTAR DEPENDENCIAS (Depends + Recommends)
                              # Combinamos ambas secciones para no perder nada
                              deps = data.get("depends", {})
                              recs = data.get("recommends", {})
                              all_deps = {**deps, **recs} # Prioridad a depends pero incluimos recommends
                              
                              for dep in all_deps.keys():
                                  dep_low = dep.lower()
                                  # Filtrar sistema y fabric-api
                                  if not any(dep_low.startswith(p) for p in ignore_prefixes) and dep_low not in ignore_list:
                                      required.setdefault(mod_id, set()).add(dep_low)
              except Exception as e:
                  print(f"  [WARN] Error reading {jar.name}: {e}")

          print("\n🔍 STAGE 2: Verifying dependencies...")
          missing = {}
          for mod, deps in required.items():
              for d in deps:
                  # Verificación flexible (ID exacto, ID con -fabric, o ID quitando -fabric)
                  variants = {d, f"{d}-fabric", d.replace("-fabric", ""), d.replace("_", "-"), d.replace("-", "_")}
                  if not any(v in provided for v in variants):
                      missing.setdefault(mod, []).append(d)

          if missing:
              print("\n❌ CRITICAL: MISSING DEPENDENCIES DETECTED!")
              print("The following mods require libraries that are NOT in your modpack:")
              for mod, deps in sorted(missing.items()):
                  print(f"  • Mod '{mod}' needs: {', '.join(deps)}")
              print("\n💡 Tip: Check if those IDs correspond to mods like 'Aquarius Libs' and add them via packwiz.")
              sys.exit(1)
          
          print("\n✅ All internal dependencies (including 'recommends') are satisfied!")
          PY