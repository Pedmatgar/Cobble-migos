name: Modpack CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  modpack-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKWIZ_MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
      MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
      PACKWIZ_CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Export Modrinth pack
        if: env.PACKWIZ_CURSEFORGE_API_TOKEN != ''
        run: |
          packwiz mr export -o "$RUNNER_TEMP/modpack.mrpack"

      - name: Unpack and Collect Jars
        if: env.PACKWIZ_CURSEFORGE_API_TOKEN != ''
        run: |
          python - <<'PY'
          import zipfile
          import json
          import shutil
          import urllib.request
          from pathlib import Path

          temp = Path("${{ runner.temp }}")
          mrpack = temp / "modpack.mrpack"
          unpacked = temp / "modpack-unpacked"
          collected = temp / "collected-mods"
          collected.mkdir(parents=True, exist_ok=True)

          # 1. Unpack
          with zipfile.ZipFile(mrpack) as zf:
              zf.extractall(unpacked)

          # 2. Collect overrides
          for folder in ("overrides", "client-overrides", "server-overrides"):
              mods_dir = unpacked / folder / "mods"
              if mods_dir.exists():
                  for jar in mods_dir.glob("*.jar"):
                      shutil.copy2(jar, collected / jar.name)

          # 3. Download from index
          index_path = unpacked / "modrinth.index.json"
          data = json.loads(index_path.read_text(encoding="utf-8"))
          for file_entry in data.get("files", []):
              path = file_entry.get("path", "")
              if path.startswith("mods/"):
                  destination = collected / Path(path).name
                  urllib.request.urlretrieve(file_entry["downloads"][0], destination)
          PY

      - name: Dependency Check (Robust Version)
        if: env.PACKWIZ_CURSEFORGE_API_TOKEN != ''
        run: |
          # Instalamos tomli para compatibilidad si fuera necesario
          pip install tomli
          python - <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          jars_dir = Path("${{ runner.temp }}") / "collected-mods"
          ignore = {"minecraft", "java", "fabricloader", "fabric", "forge", "neoforge", "quilt_loader"}
          
          provided = set()
          required = {}

          for jar in jars_dir.glob("*.jar"):
              try:
                  with zipfile.ZipFile(jar) as zf:
                      # Buscamos Fabric
                      if "fabric.mod.json" in zf.namelist():
                          # 'strict=False' evita el error de caracteres de control que viste antes
                          data = json.loads(zf.read("fabric.mod.json").decode("utf-8", errors="ignore"), strict=False)
                          mod_id = data.get("id")
                          if mod_id:
                              provided.add(mod_id)
                              for dep in data.get("depends", {}).keys():
                                  if dep not in ignore and not dep.startswith("fabric-api"):
                                      required.setdefault(mod_id, set()).add(dep)
                      
                      # Buscamos Forge/NeoForge
                      if "META-INF/mods.toml" in zf.namelist():
                          data = tomllib.loads(zf.read("META-INF/mods.toml").decode("utf-8", errors="ignore"))
                          for m in data.get("mods", []):
                              mid = m.get("modId")
                              if mid:
                                  provided.add(mid)
                                  # Extraer dependencias de Forge es más complejo por su formato, 
                                  # pero aquí registramos el ID para que otros no fallen.
              except Exception as e:
                  print(f"Warning: Could not parse {jar.name}: {e}")

          missing = {mod: [d for d in deps if d not in provided] for mod, deps in required.items()}
          missing = {m: d for m, d in missing.items() if d}

          if missing:
              print("\n❌ MISSING DEPENDENCIES FOUND:")
              for mod, deps in missing.items():
                  print(f"  - {mod} requires: {', '.join(deps)}")
              sys.exit(1)
          
          print("\n✅ All dependencies satisfied!")
          PY