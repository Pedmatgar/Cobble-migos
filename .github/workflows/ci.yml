name: Modpack CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  modpack-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKWIZ_MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
      MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
      PACKWIZ_CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Export Modrinth pack
        run: |
          # Solo exportamos si tenemos el token de CurseForge o si no hay mods de CF
          packwiz mr export -o "$RUNNER_TEMP/modpack.mrpack"

      - name: Unpack and Collect Jars
        run: |
          python - <<'PY'
          import zipfile
          import json
          import shutil
          import urllib.request
          from pathlib import Path

          temp = Path("${{ runner.temp }}")
          mrpack = temp / "modpack.mrpack"
          unpacked = temp / "modpack-unpacked"
          collected = temp / "collected-mods"
          collected.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(mrpack) as zf:
              zf.extractall(unpacked)

          for folder in ("overrides", "client-overrides", "server-overrides"):
              mods_dir = unpacked / folder / "mods"
              if mods_dir.exists():
                  for jar in mods_dir.glob("*.jar"):
                      shutil.copy2(jar, collected / jar.name)

          index_path = unpacked / "modrinth.index.json"
          data = json.loads(index_path.read_text(encoding="utf-8"))
          for file_entry in data.get("files", []):
              path = file_entry.get("path", "")
              if path.startswith("mods/"):
                  destination = collected / Path(path).name
                  if not destination.exists():
                      print(f"Downloading {path}...")
                      urllib.request.urlretrieve(file_entry["downloads"][0], destination)
          PY

      - name: Dependency Check (Robust Version)
        run: |
          pip install tomli
          python - <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          jars_dir = Path("${{ runner.temp }}") / "collected-mods"
          # Lista extendida de cosas que el CI debe ignorar porque son del sistema o de Fabric API
          ignore_prefixes = ["fabric-", "quilt-", "minecraft", "java", "fabricloader", "fabric", "forge", "neoforge"]
          
          provided = set()
          required = {}

          print("--- Scanning Jars ---")
          for jar in jars_dir.glob("*.jar"):
              try:
                  with zipfile.ZipFile(jar) as zf:
                      if "fabric.mod.json" in zf.namelist():
                          data = json.loads(zf.read("fabric.mod.json").decode("utf-8", errors="ignore"), strict=False)
                          mod_id = data.get("id")
                          if mod_id:
                              provided.add(mod_id.lower())
                              # IMPORTANT: Add what this mod provides (fixes Fabric API sub-modules)
                              for p in data.get("provides", []):
                                  provided.add(p.lower())
                              
                              # Collect dependencies
                              deps = data.get("depends", {})
                              for dep in deps.keys():
                                  dep_low = dep.lower()
                                  # Si no es algo del sistema, lo anotamos
                                  if not any(dep_low.startswith(p) for p in ignore_prefixes):
                                      required.setdefault(mod_id, set()).add(dep_low)
              except Exception as e:
                  print(f"Skipping {jar.name} due to error: {e}")

          # Segunda pasada: Comprobar qué falta
          missing = {}
          for mod, deps in required.items():
              for d in deps:
                  # Verificamos si el ID está o si hay una versión parecida (balm vs balm-fabric)
                  if d not in provided and d.replace("-fabric", "") not in provided:
                      missing.setdefault(mod, []).append(d)

          if missing:
              print("\n❌ MISSING DEPENDENCIES FOUND:")
              for mod, deps in sorted(missing.items()):
                  print(f"  - {mod} requires: {', '.join(deps)}")
              sys.exit(1)
          
          print("\n✅ All dependencies satisfied!")
          PY