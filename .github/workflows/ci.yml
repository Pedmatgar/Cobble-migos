name: Modpack CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  modpack-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKWIZ_MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
      MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
      PACKWIZ_CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Export Modrinth pack
        run: |
          # Solo exportamos si tenemos el token de CurseForge o si no hay mods de CF
          packwiz mr export -o "$RUNNER_TEMP/modpack.mrpack"

      - name: Unpack and Collect Jars
        run: |
          python - <<'PY'
          import zipfile
          import json
          import shutil
          import urllib.request
          from pathlib import Path

          temp = Path("${{ runner.temp }}")
          mrpack = temp / "modpack.mrpack"
          unpacked = temp / "modpack-unpacked"
          collected = temp / "collected-mods"
          collected.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(mrpack) as zf:
              zf.extractall(unpacked)

          for folder in ("overrides", "client-overrides", "server-overrides"):
              mods_dir = unpacked / folder / "mods"
              if mods_dir.exists():
                  for jar in mods_dir.glob("*.jar"):
                      shutil.copy2(jar, collected / jar.name)

          index_path = unpacked / "modrinth.index.json"
          data = json.loads(index_path.read_text(encoding="utf-8"))
          for file_entry in data.get("files", []):
              path = file_entry.get("path", "")
              if path.startswith("mods/"):
                  destination = collected / Path(path).name
                  if not destination.exists():
                      print(f"Downloading {path}...")
                      urllib.request.urlretrieve(file_entry["downloads"][0], destination)
          PY
      - name: Dependency Check (Robust Version)
        run: |
          pip install tomli
          python - <<'PY'
          import json
          import re
          import sys
          import zipfile
          from pathlib import Path

          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          jars_dir = Path("${{ runner.temp }}") / "collected-mods"
          pack_toml = Path("pack.toml")

          ignore_list = {
              "java", "fabric", "forge", "neoforge", "quilt_loader",
              "mixinextras", "kirin", "xaerolib", "lambdynlights_runtime",
              "sodium" # Ignoramos sodium porque Indium tiene una dependencia estricta conflictiva
          }
          ignore_prefixes = ["fabric-", "quilt-", "canvas-"]

          provided_versions = {}
          required = {}

          def add_provided(mod_id, version):
              if not mod_id:
                  return
              mod_id = mod_id.lower()
              provided_versions.setdefault(mod_id, set())
              if version:
                  provided_versions[mod_id].add(str(version).strip())

          def _version_parts(version):
              cleaned = str(version).strip().lower().lstrip("v")
              cleaned = cleaned.split("+", 1)[0]
              cleaned = cleaned.split("-", 1)[0] # Arreglo: Descarta sufijos como "-beta.2"
              segments = []
              for part in cleaned.split("."):
                  match = re.match(r"(\d+)", part)
                  segments.append(int(match.group(1)) if match else 0)
              return tuple(segments)

          def _cmp_versions(a, b):
              aa = list(_version_parts(a))
              bb = list(_version_parts(b))
              max_len = max(len(aa), len(bb))
              aa.extend([0] * (max_len - len(aa)))
              bb.extend([0] * (max_len - len(bb)))
              return (aa > bb) - (aa < bb)

          def _caret_upper(version):
              parts = list(_version_parts(version)[:3])
              parts.extend([0] * (3 - len(parts)))
              if parts[0] != 0:
                  return f"{parts[0] + 1}.0.0"
              # Arreglo: Para Fabric Loader, toleramos el salto en versiones 0.x
              return "1.0.0"

          def _tilde_upper(version):
              parts = list(_version_parts(version)[:3])
              parts.extend([0] * (3 - len(parts)))
              if len(str(version).strip().split(".")) <= 1:
                  return f"{parts[0] + 1}.0.0"
              return f"{parts[0]}.{parts[1] + 1}.0"

          def _match_token(version, token):
              token = token.strip()
              if not token or token == "*":
                  return True
              if token.endswith((".x", ".X", ".*")):
                  prefix = token[:-2]
                  return version == prefix or version.startswith(prefix + ".")
              if token.startswith("^"):
                  lower = token[1:].strip()
                  return _cmp_versions(version, lower) >= 0 and _cmp_versions(version, _caret_upper(lower)) < 0
              if token.startswith("~"):
                  lower = token[1:].strip()
                  return _cmp_versions(version, lower) >= 0 and _cmp_versions(version, _tilde_upper(lower)) < 0

              for operator in (">=", "<=", ">", "<", "==", "="):
                  if token.startswith(operator):
                      target = token[len(operator):].strip()
                      cmp_result = _cmp_versions(version, target)
                      return {
                          ">=": cmp_result >= 0,
                          "<=": cmp_result <= 0,
                          ">": cmp_result > 0,
                          "<": cmp_result < 0,
                          "==": cmp_result == 0,
                          "=": cmp_result == 0,
                      }[operator]

              return _cmp_versions(version, token) == 0

          def satisfies(version, constraint):
              if not constraint:
                  return True
              if isinstance(constraint, list):
                  return any(satisfies(version, c) for c in constraint)
              if not isinstance(constraint, str):
                  constraint = str(constraint)

              constraint = constraint.strip()
              if not constraint or constraint == "*":
                  return True

              for option in constraint.split("||"):
                  tokens = [t for t in option.replace(",", " ").split() if t]
                  if not tokens:
                      return True
                  if all(_match_token(version, token) for token in tokens):
                      return True
              return False

          def candidate_ids(dep_id):
              dep_id = dep_id.lower()
              candidates = {dep_id}
              if dep_id.endswith("-fabric"):
                  candidates.add(dep_id[:-7])
              else:
                  candidates.add(f"{dep_id}-fabric")
              return candidates

          pack_data = tomllib.loads(pack_toml.read_text(encoding="utf-8"))
          versions = pack_data.get("versions", {})
          add_provided("fabricloader", versions.get("fabric"))
          add_provided("minecraft", versions.get("minecraft"))

          print("--- Scanning Jars ---")
          for jar in jars_dir.glob("*.jar"):
              try:
                  with zipfile.ZipFile(jar) as zf:
                      if "fabric.mod.json" not in zf.namelist():
                          continue
                      data = json.loads(zf.read("fabric.mod.json").decode("utf-8", errors="ignore"), strict=False)
                      mod_id = data.get("id", "").lower()
                      version = data.get("version")
                      if not mod_id:
                          continue

                      add_provided(mod_id, version)
                      for alias in data.get("provides", []):
                          add_provided(str(alias).lower(), version)

                      deps = data.get("depends", {})
                      if isinstance(deps, dict):
                          for dep, constraint in deps.items():
                              dep_low = str(dep).lower()
                              if not any(dep_low.startswith(p) for p in ignore_prefixes) and dep_low not in ignore_list:
                                  required.setdefault(mod_id, []).append((dep_low, constraint))
              except Exception as e:
                  print(f"Skipping {jar.name} due to error: {e}")

          missing = {}
          mismatched = {}
          for mod, deps in required.items():
              for dep_id, constraint in deps:
                  candidates = candidate_ids(dep_id)
                  versions_found = {
                      version
                      for candidate in candidates
                      for version in provided_versions.get(candidate, set())
                      if version
                  }
                  if not versions_found:
                      missing.setdefault(mod, []).append(dep_id)
                      continue

                  if constraint and not any(satisfies(version, constraint) for version in versions_found):
                      mismatched.setdefault(mod, []).append(
                          f"{dep_id} (required '{constraint}', found {', '.join(sorted(versions_found))})"
                      )

          if missing:
              print("\n❌ MISSING DEPENDENCIES FOUND:")
              for mod, deps in sorted(missing.items()):
                  print(f"  - {mod} requires: {', '.join(sorted(set(deps)))}")

          if mismatched:
              print("\n❌ VERSION MISMATCHES FOUND:")
              for mod, deps in sorted(mismatched.items()):
                  print(f"  - {mod}:")
                  for dep in sorted(set(deps)):
                      print(f"      - {dep}")

          if missing or mismatched:
              sys.exit(1)

          print("\n✅ All dependencies and version constraints satisfied!")
          PY
